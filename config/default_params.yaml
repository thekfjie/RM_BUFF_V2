%YAML:1.0

HSV:
    lowerLimit: [0, 100, 100]
    upperLimit: [15, 255, 255]

MayBeTarget:
    width: 25.0
    height: 45.0
    area: 800.0

outsideRate: 1.5
insideRate: 0.6
kernel: 3
"video relative path": "video/buff.avi"
start: 0

# --- Optional: detector config ---
detectorType: "hsv"
onnxModelPath: ""
yoloConfidence: 0.5
yoloNmsThreshold: 0.45
yoloInputWidth: 640
yoloInputHeight: 640
yoloRefreshInterval: 30

# --- Optional: bullet flight compensation ---
enableCompensation: 0
bulletSpeed: 15.0
targetDistance: 7.0
commLatencySec: 0.01
gimbalDelaySec: 0.05
extraDelaySec: 0.0
