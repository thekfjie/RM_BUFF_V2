%YAML:1.0
# 离线运行配置模板
# 给 predict_example_main 的 --config 使用
#
# 常改项：
# - parameterPath: 场景参数文件，一般指向 examples/.../parameter.yaml
# - videoPath: 可选，留空表示使用 parameter.yaml 里自带的视频路径
# - color: 目标颜色，red 或 blue
# - mode: small 或 big
# - detector: hsv 或 yolo
# - onnxModelPath: YOLO 模型路径

# rm_vision 根目录，通常就是 E:/RM/rm_vision
pythonRoot: "../../.."

# 场景 parameter.yaml 路径，支持相对路径
parameterPath: "examples/example_for_prediction/8_dark_blue_small/parameter.yaml"

# 可选：直接覆盖视频路径；留空表示按 parameter.yaml 里的 video relative path 读取
videoPath: ""

# 目标颜色：red / blue
color: "blue"

# 模式：small / big
mode: "small"

# 算法频率，通常按相机实际帧率填写
freq: 50

# 预测提前量，单位秒
deltaT: 0.2

# 是否显示窗口：1=显示，0=不显示
imshow: 1

# 检测模式：hsv / yolo
detector: "yolo"

# YOLO 模型路径；detector=hsv 时可以留空
onnxModelPath: "../../models/best.onnx"

# 丢失后，两次 YOLO 重锁之间至少间隔多少帧
yoloRelockIntervalFrames: 3

# 连续丢失多少帧后才开始尝试 YOLO 重锁
yoloRelockAfterMisses: 1

# 是否进入调参模式：1=调参，0=正常运行
tune: 0

# 调参模式下固定停在第几帧；-1 表示运行后手动选帧
tuneFrame: -1

# 调参预览播放速度
tunePreviewSpeed: 1.0

# 可选：手动指定 R 的初始 ROI，格式 [x, y, w, h]
rBox: []

# 可选：手动指定扇叶的初始 ROI，格式 [x, y, w, h]
fanBox: []
