buff_tracker_node:
  ros__parameters:
    # Dedicated config for Win11 + at_vision_simulator ROS 2 bring-up.
    color: red
    mode: small
    delta_t: 0.2
    freq: 60

    detector_type: yolo
    onnx_model_path: "models/best.onnx"
    yolo_confidence: 0.25
    yolo_nms_threshold: 0.45
    yolo_input_width: 640
    yolo_input_height: 640
    yolo_refresh_interval: 30
    yolo_relock_interval_frames: 3
    yolo_relock_after_misses: 1
    yolo_show_debug: true

    publish_debug_image: true
    show_debug_window: true

    enable_compensation: false
    bullet_speed: 15.0
    target_distance: 7.0
    comm_latency_sec: 0.01
    gimbal_delay_sec: 0.05
    extra_delay_sec: 0.0

    hsv_lower: [0, 100, 100]
    hsv_upper: [15, 255, 255]
    kernel: 3
    inside_rate: 0.6
    outside_rate: 1.5

    # Leave ROI parameters omitted when unused. On Windows ROS 2, an empty []
    # override is treated as "not set" and can break typed array parameters.
    # static_r_roi: [x, y, w, h]
    # static_fan_roi: [x, y, w, h]
