buff_detector_node:
  ros__parameters:
    image_topic: /camera/image_raw
    camera_info_topic: /camera_info
    observation_topic: /buff/detector/observation
    debug_image_topic: /buff/detector/debug_image

    color: blue
    mode: small
    delta_t: 0.2
    freq: 50

    # Big BUFF: timestamped velocity samples, omega grid search and inlier refit.
    big_fit_omega_steps: 200
    big_fit_update_stride: 5
    big_fit_min_inliers: 100
    big_fit_max_samples: 300
    big_fit_min_inlier_ratio: 0.60
    big_fit_inlier_threshold: 0.50
    big_fit_min_omega: 1.884
    big_fit_max_omega: 2.000
    big_fit_min_amplitude: 0.780
    big_fit_max_amplitude: 1.045
    big_fit_max_abs_speed: 2.090
    big_fit_max_observation_gap: 0.50
    big_fit_max_phase_jump: 0.80
    big_fit_min_sample_span: 1.5
    big_fit_max_model_age: 0.25
    big_fit_max_consecutive_rejected: 8

    detector_type: yolo
    onnx_model_path: models/best.onnx
    yolo_confidence: 0.25
    yolo_nms_threshold: 0.45
    yolo_input_width: 640
    yolo_input_height: 640
    # Every frame revalidates target activation and supplies current pose points.
    # Increase only for a measured hybrid-tracking experiment.
    yolo_refresh_interval: 1
    yolo_show_debug: false

    publish_debug_image: true
    show_debug_window: false

    enable_compensation: false
    bullet_speed: 15.0
    target_distance: 7.0
    comm_latency_sec: 0.01
    gimbal_delay_sec: 0.05
    extra_delay_sec: 0.0

    # PnP stays disabled until the real BUFF blade object points are measured.
    enable_pnp: false
    pnp_depth_max_age: 0.15
    pnp_max_reprojection_error: 3.0
    max_image_age: 0.25

    hsv_lower: [90, 100, 100]
    hsv_upper: [130, 255, 255]
    kernel: 3
    inside_rate: 0.6
    outside_rate: 1.5

buff_spatial_tracker_node:
  ros__parameters:
    observation_topic: /buff/detector/observation
    target_topic: /buff/tracker/target
    target_frame: odom
    enable_tf: true
    lost_time_thres: 0.3
    observation_timeout: 0.15
    max_observation_age: 0.25
    prediction_lead_time: 0.0
    velocity_smoothing_alpha: 0.45
