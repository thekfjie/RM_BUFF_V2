buff_tracker_node:
  ros__parameters:
    color: red
    mode: small
    delta_t: 0.2
    freq: 50

    detector_type: yolo
    # Edit this to the real model path on the robot.
    # If you keep the source tree in ~/rm_ws/src/rm_buff_tracker, this path can stay as-is.
    onnx_model_path: "/home/rm/rm_ws/src/rm_buff_tracker/models/best.onnx"
    yolo_confidence: 0.25
    yolo_nms_threshold: 0.45
    yolo_input_width: 640
    yolo_input_height: 640
    yolo_refresh_interval: 30
    yolo_relock_interval_frames: 3
    yolo_relock_after_misses: 1

    publish_debug_image: true
    show_debug_window: false

    enable_compensation: false
    bullet_speed: 15.0
    target_distance: 7.0
    comm_latency_sec: 0.01
    gimbal_delay_sec: 0.05
    extra_delay_sec: 0.0

    hsv_lower: [0, 100, 100]
    hsv_upper: [15, 255, 255]
    kernel: 3
    inside_rate: 0.6
    outside_rate: 1.5

    # Optional: only needed when detector_type == hsv
    static_r_roi: []
    static_fan_roi: []
